# historian plugin release gate config — seat-authored 2026-10-02 under the debridement ruling.
# Identity allowlist mirrors the operator's machine-wide precedent (harness/Abathur/border.yaml
# rules.authors): same GitHub noreply person in both shipped formats + the pre-existing
# Wiki.js service-account commits already public in this repo's history.
#
# Rule-IDs below are written with \u005c escapes for backslashes: YAML-decoded values are the
# exact rule strings, while the config FILE bytes stay free of backslash sequences — otherwise
# the path heuristics scan this config as content and every waiver line breeds new findings
# (self-referential regress observed live 2026-10-02: 46 blocking on border.yaml alone).
targets:
  git:
    remotes:
      - name: origin
        url: git@github.com:TachikomaGundam/opencode-historian.git
rules:
  authors:
    emails: [TachikomaGundam@users.noreply.github.com, 296048333+TachikomaGundam@users.noreply.github.com, bot@gate-corp.com]
    names: [TachikomaGundam, Wiki.js]
  hosts: []
  ips: []
  pathPatterns: []

