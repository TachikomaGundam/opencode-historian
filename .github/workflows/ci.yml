# Every push/PR gets the same build+test+audit gates the publish path uses,
# so breakage surfaces at the commit, not at the release tag (audit I1).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx vitest run
      - run: node tools/privacy-audit.mjs
      - run: node tools/portable-binding-audit.mjs
